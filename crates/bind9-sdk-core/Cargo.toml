[package]
name = "bind9-sdk-core"
description = "Core DNS types, zone parsing, and RFC 2136 message construction for bind9-sdk (no_std + alloc)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Enables std::error::Error impls and std-dependent utilities
std = ["thiserror/std", "serde?/std", "dep:getrandom", "dep:tracing"]
# Enables serde Serialize/Deserialize on DNS types
serde = ["dep:serde"]
# Enables Rayon-based parallel zone parsing (implies std; incompatible with WASM)
parallel = ["std", "dep:rayon"]

[dependencies]
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
digest = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
zeroize = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
getrandom = { workspace = true, features = ["std"], optional = true }
tracing = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
