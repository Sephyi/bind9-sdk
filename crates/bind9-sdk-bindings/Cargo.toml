[package]
name = "bind9-sdk-bindings"
description = "Node.js and Bun native bindings for bind9-sdk via napi-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
napi-bindings = ["dep:napi", "dep:napi-derive"]
# Node.js/Bun native addon via napi-rs v3 (full surface including rndc/IXFR/nsupdate)
nodejs = ["napi-bindings", "dep:bind9-sdk-net", "dep:tokio-stream"]
# Browser/Node WASI bindings expose the core-only surface.
wasm = ["napi-bindings"]

[dependencies]
bind9-sdk-core = { workspace = true, features = ["std"] }
bind9-sdk-net = { workspace = true, optional = true }
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
serde_json = { workspace = true }
tokio-stream = { workspace = true, optional = true }

[build-dependencies]
napi-build = "2"
