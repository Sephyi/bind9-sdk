name: Bug Report
description: Report a bug in bind9-sdk
labels: [bug]

body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of bind9-sdk is affected?
      options:
        - Rust crate (bind9-sdk)
        - Node.js / Bun bindings
        - CLI tool (bind9)
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SDK Version
      description: "Output of `cargo pkgid bind9-sdk` or npm package version."
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Create a TsigKey with ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include error messages or panic output.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System details relevant to the bug.
      value: |
        - OS:
        - Rust version:
        - BIND9 version:
        - Node.js version (if applicable):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant log output, stack traces, or wire dumps.
      render: text
    validations:
      required: false
