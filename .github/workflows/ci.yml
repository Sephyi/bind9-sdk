name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Reject production panic paths
        run: >-
          cargo clippy --workspace --lib --bins --
          -D clippy::unwrap_used
          -D clippy::expect_used
          -D clippy::panic
          -D clippy::unreachable

  test:
    name: Test
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  live-bind:
    name: Live BIND 9.20
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Start BIND fixture
        run: docker compose -f tests/bind9/podman-compose.yml up -d --build
      - name: Wait for BIND health
        run: |
          for attempt in $(seq 1 30); do
            if docker compose -f tests/bind9/podman-compose.yml exec -T bind9 \
              rndc -c /etc/bind/rndc.conf status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f tests/bind9/podman-compose.yml logs
          exit 1
      - name: Run live protocol suite
        run: cargo test --workspace -- --ignored
      - name: Stop BIND fixture
        if: always()
        run: docker compose -f tests/bind9/podman-compose.yml down -v

  wasm-check:
    name: WASM no_std
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - run: cargo check -p bind9-sdk-core --target wasm32-unknown-unknown --no-default-features
      - run: cargo check -p bind9-sdk --target wasm32-unknown-unknown --no-default-features

  doc:
    name: Documentation
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  bindings-native:
    name: napi Bindings (Node ${{ matrix.node }})
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # package.json engines requires Node >= 22; Node 20 is intentionally
        # below the supported floor and is therefore not in the matrix.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: cargo check -p bind9-sdk-bindings --features nodejs
      - name: Build native addon
        working-directory: crates/bind9-sdk-bindings
        run: |
          npm ci
          npm run build
      - name: Native smoke + package contract
        working-directory: crates/bind9-sdk-bindings
        run: |
          node tests/smoke.mjs
          node tests/package-contract.mjs

  bindings-bun:
    name: napi Bindings (Bun)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - name: Build native addon
        working-directory: crates/bind9-sdk-bindings
        run: |
          npm ci
          npm run build
      - name: Bun smoke
        working-directory: crates/bind9-sdk-bindings
        run: bun tests/smoke.mjs

  bindings-wasm:
    name: napi Bindings (WASI)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build WASI addon and run fallback smoke
        working-directory: crates/bind9-sdk-bindings
        run: |
          npm ci
          npm run build:wasm
          node tests/wasm-smoke.mjs

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-smoke:
    name: Fuzz Smoke (FR-061)
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # The in-crate `--features fuzzing` regression tests pin past crashes and
      # seed inputs deterministically; this job adds a short live libFuzzer run
      # over each target's committed corpus. A real 24h clean run remains a
      # pre-v1.0 release gate (see PRD FR-061), not something CI claims.
      - name: Run fuzzing-feature regression tests
        run: |
          cargo test -p bind9-sdk-core --features fuzzing fuzz::
          cargo test -p bind9-sdk-net --features fuzzing fuzz::
      - name: Bounded smoke fuzz over each target
        working-directory: fuzz
        run: |
          set -uo pipefail
          status=0
          for target in \
            fuzz_zone_parser fuzz_rndc_response fuzz_stats_json \
            fuzz_named_conf fuzz_zone_roundtrip fuzz_tsig_wire \
            fuzz_transfer_wire fuzz_update_response; do
            echo "::group::$target"
            # Backstop `timeout`: some libFuzzer builds ignore -max_total_time.
            # A clean SIGTERM (124) is acceptable; a crash writes an artifact,
            # which is checked below and fails the job.
            timeout --signal=TERM 90s \
              cargo fuzz run "$target" -- -max_total_time=30 -rss_limit_mb=2048 || true
            if compgen -G "artifacts/$target/*" > /dev/null; then
              echo "::error::fuzz target $target produced a crash artifact"
              ls -la "artifacts/$target/"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  deny:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  msrv:
    name: MSRV + Stable
    needs: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.94.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo check --workspace --all-features

  reuse:
    name: REUSE Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v4
