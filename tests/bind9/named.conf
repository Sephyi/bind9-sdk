// Test BIND9 configuration for bind9-sdk integration tests.

key "rndc-test-key" {
    algorithm hmac-sha256;
    secret "dGVzdGtleWZvcmJpbmQ5c2RrdGVzdGluZzEyMzQ1Ng==";
};

controls {
    inet 0.0.0.0 port 953 allow { any; } keys { "rndc-test-key"; };
};

statistics-channels {
    inet 0.0.0.0 port 8053 allow { any; };
};

options {
    directory "/var/lib/bind";
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { any; };
    dnssec-validation no;
};

zone "example.com" {
    type primary;
    file "example.com.zone";
    allow-update { key "rndc-test-key"; };
};

zone "dnssec.example.com" {
    type primary;
    file "dnssec.example.com.zone";
    dnssec-policy default;
    inline-signing yes;
};

zone "transfer.example.com" {
    type primary;
    file "transfer.example.com.zone";
    allow-transfer { key "rndc-test-key"; };
};
