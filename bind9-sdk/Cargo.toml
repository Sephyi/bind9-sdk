[package]
name = "bind9-sdk"
description = "BIND9 management SDK — rndc wire protocol, RFC 2136, IXFR/AXFR, statistics-channel. Rust-native with WASM and Node.js native bindings."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["net"]
# Network layer: rndc TCP client, nsupdate sender, IXFR/AXFR, statistics HTTP client
net = ["dep:bind9-sdk-net"]

[dependencies]
bind9-sdk-core = { workspace = true, features = ["std"] }
bind9-sdk-net = { workspace = true, optional = true }
